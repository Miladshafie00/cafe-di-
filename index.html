<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>منوی دیجیتال کافه دی</title>
    
    <!-- فراخوانی فونت‌ها از CDN -->
    <style>
        @import url('https://cdn.fontcdn.ir/Font/Persian/Vazirmatn/Vazirmatn.css');
        @import url('https://cdn.fontcdn.ir/Font/Persian/IranNastaliq/IranNastaliq.css');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* فونت خوانای وزیر برای کل سایت */
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)),
                        url('m.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #fff;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* اعمال نستعلیق فقط برای تیترها */
        h1, h2, .logo-placeholder {
            font-family: 'IranNastaliq', cursive;
        }

        header {
            text-align: center;
            padding: 40px 20px 20px;
        }

        .logo-container {
            width: 110px;
            height: 110px;
            margin: 0 auto 15px;
            border-radius: 50%;
            border: 3px solid #d4a373;
            box-shadow: 0 0 20px rgba(212, 163, 115, 0.4);
            overflow: hidden;
            background: #222;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-placeholder {
            font-size: 50px; /* بزرگتر برای نستعلیق */
            color: #d4a373;
        }

        header h1 {
            font-size: 3rem; /* سایز بزرگتر برای نستعلیق */
            color: #d4a373;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        header p {
            color: #ccc;
            font-size: 0.9rem;
            font-family: 'Vazirmatn', sans-serif;
        }

        .category-nav {
            display: flex;
            overflow-x: auto;
            white-space: nowrap;
            justify-content: flex-start;
            gap: 10px;
            padding: 15px;
            position: sticky;
            top: 0;
            background: rgba(18, 18, 18, 0.95);
            backdrop-filter: blur(10px);
            z-index: 100;
            border-bottom: 1px solid rgba(212, 163, 115, 0.2);
            scrollbar-width: none;
        }

        .category-nav::-webkit-scrollbar { display: none; }

        .cat-btn {
            background: transparent;
            border: 1px solid #d4a373;
            color: #d4a373;
            padding: 8px 18px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Vazirmatn', sans-serif;
            font-size: 0.9rem;
            flex-shrink: 0;
        }

        .cat-btn.active, .cat-btn:hover {
            background: #d4a373;
            color: #121212;
            font-weight: bold;
        }

        main {
            max-width: 650px;
            margin: 25px auto;
            padding: 0 15px;
        }

        .menu-section { margin-bottom: 35px; }

        .menu-section h2 {
            text-align: right;
            color: #d4a373;
            margin-bottom: 15px;
            font-size: 2.2rem; /* بزرگتر برای جلوه نستعلیق */
            border-bottom: 2px dashed rgba(212, 163, 115, 0.3);
            padding-bottom: 8px;
        }

        .menu-items { display: flex; flex-direction: column; gap: 12px; }

        .menu-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(212, 163, 115, 0.15);
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .item-name { font-size: 1rem; font-weight: bold; color: #fff; }
        .item-desc { font-size: 0.8rem; color: #aaa; margin-top: 4px; }
        .item-price { font-size: 0.95rem; color: #d4a373; font-weight: bold; margin-right: 15px; }

        footer { text-align: center; color: #777; font-size: 0.8rem; margin-top: 30px; }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <span class="logo-placeholder">دی</span>
        </div>
        <h1>کافه دی</h1>
        <p>تجربه‌ای دلنشین از عطر و طعم قهوه</p>
    </header>

    <nav class="category-nav">
        <button class="cat-btn active" onclick="filterCategory('all', this)">همه</button>
        <button class="cat-btn" onclick="filterCategory('hot-coffee', this)">قهوه‌های گرم</button>
        <button class="cat-btn" onclick="filterCategory('cold-coffee', this)">نوشیدنی‌های سرد</button>
        <button class="cat-btn" onclick="filterCategory('bakery', this)">کیک و دسر</button>
    </nav>

    <main>
        <section class="menu-section" data-category="hot-coffee">
            <h2>قهوه‌های گرم</h2>
            <div class="menu-items">
                <div class="menu-item">
                    <div class="item-details">
                        <div class="item-name">اسپرسو سینگل</div>
                        <div class="item-desc">۱۰۰٪ عربیکا، عصاره‌گیری استاندارد</div>
                    </div>
                    <div class="item-price">۴۵,۰۰۰ تومان</div>
                </div>
            </div>
        </section>

        <!-- ... سایر بخش‌ها ... -->
    </main>

    <script>
        function filterCategory(category, buttonElement) {
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            buttonElement.classList.add('active');
            const sections = document.querySelectorAll('.menu-section');
            sections.forEach(section => {
                if (category === 'all' || section.getAttribute('data-category') === category) {
                    section.style.display = 'block';
                } else {
                    section.style.display = 'none';
                }
            });
        }
    </script>
</body>
</html>
