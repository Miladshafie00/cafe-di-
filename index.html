
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منوی دیجیتال کافه دی</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Tahoma, sans-serif;
            /* ⬇️ ۱. مسیر عکس پس‌زمینه بزرگ اینجا تنظیم می‌شود ⬇️ */
            background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)),
                        url('m.jpg'); 
            background-size: cover; background-position: center; background-attachment: fixed;
            color: #fff; min-height: 100vh; padding-bottom: 40px;
        }

        header { text-align: center; padding: 50px 20px 20px; }

        /* استایل لوگو */
        .logo-container {
            width: 120px; height: 120px; margin: 0 auto 15px;
            border-radius: 50%; border: 3px solid #d4a373;
            box-shadow: 0 0 20px rgba(212, 163, 115, 0.4);
            overflow: hidden; background: #222;
            display: flex; align-items: center; justify-content: center;
        }

        .logo-container img {
            width: 100%; height: 100%; object-fit: cover;
            display: block;
        }

        /* اگر عکس نبود این متن جایگزین نمایش داده می‌شود */
        .logo-placeholder { font-size: 40px; color: #d4a373; font-weight: bold; }

        
        header h2 { font-size: 1.3rem; color: #9c7953; margin-bottom: 5px; }
        header p { color: #aaa; font-size: 0.9rem; }

        .category-nav {
            display: flex; overflow-x: auto; white-space: nowrap;
            justify-content: center; gap: 10px; padding: 15px;
            position: sticky; top: 0; background: rgba(0,0,0,0.9);
            backdrop-filter: blur(10px); z-index: 100;
        }

        .cat-btn {
            background: transparent; border: 1px solid #d4a373; color: #d4a373;
            padding: 8px 20px; border-radius: 25px; cursor: pointer; transition: 0.3s;
        }

        .cat-btn.active { background: #d4a373; color: #000; font-weight: bold; }

        main { max-width: 600px; margin: 20px auto; padding: 0 15px; }
        .menu-section h2 { text-align: center; color: #d4a373; margin-bottom: 20px; font-size: 1.4rem; }
        .card {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px; padding: 15px; margin-bottom: 12px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .price { color: #d4a373; font-weight: bold; font-size: 0.9rem; }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <!-- ⬇️ ۲. مسیر عکس لوگو در اینجا تنظیم می‌شود ⬇️ -->
            <img id="mainLogo" src="s.jpg" alt="لوگو" onerror="this.style.display='none'; document.getElementById('altText').style.display='block';">
            <span id="altText" class="logo-placeholder" style="display:none;">دی</span>
        </div>
      
        <h2>Cafe Dey</h2>
        <p>بهترین لحظات با طعم قهوه</p>
    </header>

    <nav class="category-nav">
        <button class="cat-btn active" onclick="showCat('coffee', this)">قهوه</button>
        <button class="cat-btn" onclick="showCat('cold', this)">بار سرد</button>
        <button class="cat-btn" onclick="showCat('dessert', this)">دسر</button>
    </nav>

    <main id="menu-content"></main>

    <script>
        // دیتای منو
        const menuData = {
            coffee: { title: 'قهوه گرم', items: [{n:
                'اسپرسو', p:'۴۵,۰۰۰'}, {n:'لاته', p:'۷۵,۰۰۰'}, {n:'کاپوچینو', p:'۷۰,۰۰۰'}] },
            cold: { title: 'نوشیدنی سرد', items: [{n:'موهیتو', p:'۸۰,۰۰۰'}, {n:'آیس لاته', p:'۸۵,۰۰۰'}] },
            dessert: { title: 'کیک و دسر', items: [{n:'چیزکیک', p:'۹۵,۰۰۰'}, {n:'کیک هویج', p:'۸۰,۰۰۰'}] }
        };

        function showCat(cat, btn) {
            // تغییر دکمه فعال
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
// رندر آیتم‌ها
            const data = menuData[cat];
            let html = <div class="menu-section"><h2>${data.title}</h2>;
            data.items.forEach(item => {
                html += <div class="card"><span>${item.n}</span><span class="price">${item.p} تومان</span></div>;
            });
            html += </div>;
            document.getElementById('menu-content').innerHTML = html;
        }

        // اجرای اولیه
        showCat('coffee', document.querySelector('.cat-btn'));
    </script>
</body>
</html>
