<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>منوی دیجیتال کافه دی</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-image: url('m.jpg');
            --gold-color: #e5b882;
            --gold-bright: #ffd194;
            --font-title: 'Lalezar', sans-serif;
            --font-body: 'Vazirmatn', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font-body);
            background: linear-gradient(rgba(12, 12, 12, 0.88), rgba(12, 12, 12, 0.94)), var(--bg-image);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: #0d0d0d;
            color: #f5f5f5;
            min-height: 100vh;
            padding-bottom: 30px;
        }

        header {
            text-align: center;
            padding: 35px 20px 15px;
        }

        .logo-container {
            width: 120px;
            height: 120px;
            margin: 0 auto 14px;
            border-radius: 50%;
            border: 2.5px solid var(--gold-color);
            box-shadow: 0 0 25px rgba(229, 184, 130, 0.35);
            overflow: hidden;
            background: #181818;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease;
        }

        .logo-container:hover {
            transform: scale(1.05);
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .logo-placeholder {
            font-family: var(--font-title);
            font-size: 46px;
            color: var(--gold-bright);
            display: none;
        }

        header h1 {
            font-family: var(--font-title);
            font-size: 2.9rem;
            color: var(--gold-bright);
            letter-spacing: 1px;
            text-shadow: 0 0 16px rgba(229, 184, 130, 0.45);
            margin-bottom: 2px;
        }

        header .subtitle {
            color: #d1d1d1;
            font-size: 0.95rem;
            font-weight: 300;
            margin-bottom: 12px;
        }

        .quote-box {
            max-width: 480px;
            margin: 0 auto 10px;
            padding: 10px 16px;
            background: rgba(229, 184, 130, 0.05);
            border-right: 3px solid var(--gold-color);
            border-left: 3px solid var(--gold-color);
            border-radius: 12px;
            font-size: 0.9rem;
            line-height: 1.7;
            color: #e0d0be;
            font-style: italic;
        }

        .category-nav {
            display: flex;
            overflow-x: auto;
            white-space: nowrap;
            justify-content: center;
            gap: 10px;
            padding: 14px 15px;
            position: sticky;
            top: 0;
            background: rgba(14, 14, 14, 0.9);
            backdrop-filter: blur(12px);
            z-index: 100;
            border-bottom: 1px solid rgba(229, 184, 130, 0.22);
        }

        .category-nav::-webkit-scrollbar {
            display: none;
        }

        .cat-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1.5px solid rgba(229, 184, 130, 0.5);
            color: var(--gold-color);
            padding: 7px 20px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: var(--font-title);
            font-size: 1.15rem;
            flex-shrink: 0;
        }

        .cat-btn.active,
        .cat-btn:hover {
            background: linear-gradient(135deg, #e5b882, #c79053);
            color: #121212;
            border-color: #ffd194;
            box-shadow: 0 0 16px rgba(229, 184, 130, 0.45);
            transform: translateY(-2px);
        }

        main {
            max-width: 580px;
            margin: 20px auto;
            padding: 0 16px;
        }

        .menu-section h2 {
            text-align: center;
            font-family: var(--font-title);
            font-size: 2.1rem;
            color: var(--gold-bright);
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(229, 184, 130, 0.25);
        }

        .card {
            background: rgba(255, 255, 255, 0.045);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(8px);
            border-radius: 16px;
            padding: 14px 20px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.25s ease;
        }

        .card:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(229, 184, 130, 0.4);
            transform: translateX(-4px);
        }

        .item-name {
            font-size: 1.05rem;
            font-weight: 600;
            color: #ffffff;
        }

        .price-wrapper {
            display: flex;
            align-items: baseline;
            gap: 5px;
        }

        .price-tag {
            font-family: var(--font-title);
            color: var(--gold-bright);
            font-size: 1.45rem;
            letter-spacing: 0.5px;
        }

        .currency {
            font-size: 0.8rem;
            font-weight: 400;
            color: #c4c4c4;
        }

        /* =========================
           گردونه شانس
           ========================= */

        .wheel-section {
            text-align: center;
            padding: 5px 0 20px;
        }

        .wheel-title {
            font-family: var(--font-title);
            color: var(--gold-bright);
            font-size: 2.1rem;
            margin-bottom: 5px;
        }

        .wheel-subtitle {
            color: #d5d5d5;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        .wheel-input {
            width: 100%;
            max-width: 350px;
            padding: 13px 15px;
            border-radius: 12px;
            border: 1px solid rgba(229, 184, 130, 0.55);
            background: rgba(0, 0, 0, 0.35);
            color: white;
            outline: none;
            font-family: var(--font-body);
            font-size: 16px;
            text-align: center;
            direction: ltr;
        }

        .wheel-input::placeholder {
            color: #aaa;
        }

        .wheel-input:focus {
            border-color: var(--gold-bright);
            box-shadow: 0 0 12px rgba(229, 184, 130, 0.18);
        }

        .wheel-area {
            width: 300px;
            height: 300px;
            max-width: 85vw;
            max-height: 85vw;
            margin: 25px auto 20px;
            position: relative;
        }

        .wheel-pointer {
            position: absolute;
            z-index: 10;
            top: -5px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 14px solid transparent;
            border-right: 14px solid transparent;
            border-top: 28px solid #ffffff;
            filter: drop-shadow(0 2px 4px #000);
        }

        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 8px solid #d4af73;
            position: relative;
            overflow: hidden;

            background:
                conic-gradient(
                    #4b3020 0deg 45deg,
                    #a96f39 45deg 90deg,
                    #6e482d 90deg 135deg,
                    #b47c43 135deg 180deg,
                    #573823 180deg 225deg,
                    #c18c52 225deg 270deg,
                    #80512c 270deg 315deg,
                    #d5a15e 315deg 360deg
                );

            transition: transform 5s cubic-bezier(.12,.72,.16,1);

            box-shadow:
                0 0 0 3px rgba(0,0,0,.3),
                0 8px 25px rgba(0,0,0,.35);
        }

        .wheel::after {
            content: "";
            position: absolute;
            width: 52px;
            height: 52px;
            background: #151515;
            border: 4px solid #e5b882;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
            box-shadow: 0 0 12px rgba(0,0,0,.5);
        }

        .wheel-label {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 90px;
            margin-left: -45px;
            margin-top: -12px;
            text-align: center;
            color: #fff;
            font-family: var(--font-title);
            font-size: 0.9rem;
            text-shadow: 0 1px 4px #000;
            z-index: 2;
            pointer-events: none;
        }

        .l1 {
            transform: rotate(22.5deg) translateY(-105px) rotate(-22.5deg);
        }

        .l2 {
            transform: rotate(67.5deg) translateY(-105px) rotate(-67.5deg);
        }

        .l3 {
            transform: rotate(112.5deg) translateY(-105px) rotate(-112.5deg);
        }

        .l4 {
            transform: rotate(157.5deg) translateY(-105px) rotate(-157.5deg);
        }

        .l5 {
            transform: rotate(202.5deg) translateY(-105px) rotate(-202.5deg);
        }

        .l6 {
            transform: rotate(247.5deg) translateY(-105px) rotate(-247.5deg);
        }

        .l7 {
            transform: rotate(292.5deg) translateY(-105px) rotate(-292.5deg);
        }

        .l8 {
            transform: rotate(337.5deg) translateY(-105px) rotate(-337.5deg);
        }

        .wheel-spin-btn {
            margin-top: 8px;
            width: 100%;
            max-width: 350px;
            padding: 13px 20px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #e5b882, #c79053);
            color: #111;
            font-family: var(--font-title);
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 5px 18px rgba(229,184,130,.22);
        }

        .wheel-spin-btn:disabled {
            opacity: .55;
            cursor: not-allowed;
        }

        .wheel-result {
            min-height: 45px;
            margin-top: 15px;
            line-height: 2;
            font-size: 1rem;
        }

        .wheel-win {
            color: var(--gold-bright);
            font-size: 1.25rem;
            font-weight: 700;
        }

        .wheel-code {
            display: inline-block;
            direction: ltr;
            background: rgba(229,184,130,.12);
            border: 1px dashed var(--gold-color);
            padding: 4px 12px;
            border-radius: 8px;
            color: var(--gold-bright);
            font-weight: bold;
            letter-spacing: 1px;
        }

        .free-box {
            display: none;
            margin: 15px auto 0;
            max-width: 350px;
            padding: 15px;
            border: 1px solid rgba(229,184,130,.35);
            border-radius: 14px;
            background: rgba(0,0,0,.25);
        }

        .free-box p {
            margin-bottom: 10px;
            color: #eee;
        }

        .free-item-input {
            width: 100%;
            padding: 11px;
            border-radius: 10px;
            border: 1px solid rgba(229,184,130,.5);
            background: rgba(0,0,0,.3);
            color: white;
            text-align: center;
            font-family: var(--font-body);
            font-size: 15px;
            outline: none;
        }

        .free-save-btn {
            margin-top: 9px;
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 10px;
            background: #e5b882;
            color: #111;
            font-family: var(--font-title);
            font-size: 1rem;
            cursor: pointer;
        }

        /* فوتر */
        footer {
            text-align: center;
            margin-top: 35px;
            padding: 20px;
        }

        .instagram-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            color: #fff;
            text-decoration: none;
            padding: 10px 22px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.95rem;
            box-shadow: 0 4px 15px rgba(220, 39, 67, 0.35);
            transition: transform 0.2s, box-shadow 0.2s;
            direction: ltr;
        }

        .instagram-badge:hover {
            transform: scale(1.04);
            box-shadow: 0 6px 20px rgba(220, 39, 67, 0.5);
        }

        .instagram-badge svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        @media (max-width: 420px) {
            .wheel-area {
                width: 270px;
                height: 270px;
            }

            .wheel-label {
                font-size: .78rem;
            }
        }
    </style>
</head>

const WORKER =
    "https://cafe-di-discount.miladsh00.workers.dev";


const menuData = {

    coffee: {

        items: [

function normalizeDigits(value) {

    return String(value)
        .replace(/[۰-۹]/g, function(d) {
            return "۰۱۲۳۴۵۶۷۸۹".indexOf(d);
        })
        .replace(/[٠-٩]/g, function(d) {
            return "٠١٢٣٤٥٦٧٨٩".indexOf(d);
        });
}


function normalizePhone(value) {

    let p = normalizeDigits(value)
        .trim()
        .replace(/[\s\-()]/g, "");

    if (p.startsWith("+98")) {
        p = "0" + p.substring(3);
    }
    else if (p.startsWith("98") && p.length === 12) {
        p = "0" + p.substring(2);
    }

    return p;
}


function validPhone(phone) {
    return /^09\d{9}$/.test(phone);
}


function showMenu(cat, clickedBtn) {

    const data = menuData[cat];

    if (!data) return;

    document.querySelectorAll('.cat-btn').forEach(function(btn) {
        btn.classList.remove('active');
    });

    if (clickedBtn) {
        clickedBtn.classList.add('active');
    }

    let html =
        '<div class="menu-section">' +
        '<h2>' + data.title + '</h2>';

    data.items.forEach(function(item) {

        html +=
            '<div class="card">' +

                '<span class="item-name">' +
                    item.n +
                '</span>' +

                '<div class="price-wrapper">' +

                    '<span class="price-tag">' +
                        item.p +
                    '</span>' +

                    '<span class="currency">' +
                        'هزار تومان' +
                    '</span>' +

                '</div>' +

            '</div>';
    });

    html += '</div>';

    document.getElementById('menu-content').innerHTML = html;
}


function showWheel(clickedBtn) {

    document.querySelectorAll('.cat-btn').forEach(function(btn) {
        btn.classList.remove('active');
    });

    if (clickedBtn) {
        clickedBtn.classList.add('active');
    }

    document.getElementById('menu-content').innerHTML = `

        <section class="wheel-section">

            <div class="wheel-title">
                🎡 گردونه شانس کافه دی
            </div>

            <div class="wheel-subtitle">
                شانست رو امتحان کن و جایزه‌ات رو بگیر!
            </div>

            <input
                id="wheelPhone"
                class="wheel-input"
                type="tel"
                inputmode="numeric"
                maxlength="13"
                placeholder="شماره موبایل"
            >

            <div class="wheel-area">

                <div class="wheel-pointer"></div>

                <div id
