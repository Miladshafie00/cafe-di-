   WHEEL
========================= */

    direction:ltr;

    font-family:var(--body);

    font-size:14px;
}

.phone-input::placeholder{
    color:#aaa;
}


/* WHEEL AREA */

.wheel-area{
    position:relative;

    width:250px;
    height:250px;

    margin:20px auto 16px;
}


/* POINTER */

.pointer{
    position:absolute;

    z-index:20;

    left:50%;
    top:-3px;

    transform:translateX(-50%);

    width:0;
    height:0;

    border-left:13px solid transparent;
    border-right:13px solid transparent;

    border-top:25px solid white;

    filter:drop-shadow(0 2px 3px black);
}


/* WHEEL */

.wheel{
    position:relative;

    width:100%;
    height:100%;

    border-radius:50%;

    border:7px solid #d4af73;

    overflow:hidden;

    background:
    conic-gradient(
        #4b3020 0deg 45deg,
        #a96f39 45deg 90deg,
        #6e482d 90deg 135deg,
        #b47c43 135deg 180deg,
        #573823 180deg 225deg,
        #c18c52 225deg 270deg,
        #80512c 270deg 315deg,
        #d5a15e 315deg 360deg
    );

    transition:
    transform 5s cubic-bezier(.12,.72,.16,1);

    box-shadow:
    0 5px 25px rgba(0,0,0,.5);
}


/* CENTER */

.wheel-center{
    position:absolute;

    z-index:10;

    width:45px;
    height:45px;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:#151515;

    border:4px solid var(--gold);

    box-shadow:0 0 10px #000;

/* ===================================
   تبدیل اعداد
=================================== */

function normalizeDigits(value){

return String(value)

.replace(/[۰-۹]/g,function(d){
return "۰۱۲۳۴۵۶۷۸۹".indexOf(d);
})

.replace(/[٠-٩]/g,function(d){
return "٠١٢٣٤٥٦٧٨٩".indexOf(d);
});

}


function normalizePhone(value){

let phone =
normalizeDigits(value)
.trim()
.replace(/[\s\-()]/g,"");


if(phone.startsWith("+98")){

phone =
"0"+phone.substring(3);

}

else if(
phone.startsWith("98") &&
phone.length===12
){

phone =
"0"+phone.substring(2);

}


return phone;

}


function isPhone(phone){

return /^09\d{9}$/.test(phone);

}

/* ===================================
   عملکرد گردونه
=================================== */

function setupWheel(){

const phone =
document.getElementById("phone");

const spin =
document.getElementById("spin");

const wheel =
document.getElementById("wheel");

const result =
document.getElementById("result");

const freeBox =
document.getElementById("freeBox");

const freeItem =
document.getElementById("freeItem");

const freeButton =
document.getElementById("freeButton");


let rotation = 0;

let spinning = false;


spin.addEventListener(
"click",
async function(){

if(spinning) return;


const phoneNumber =
normalizePhone(phone.value);


if(!isPhone(phoneNumber)){

result.innerHTML =
"❌ لطفاً شماره موبایل معتبر وارد کنید.";

return;

}


spinning = true;

spin.disabled = true;

freeBox.style.display =
"none";

result.innerHTML =
"⏳ در حال بررسی...";


try{


/* بررسی قبلی */

const checkResponse =
await fetch(
WORKER+
"/check?phone="+
encodeURIComponent(phoneNumber)
);


const check =
await checkResponse.json();


if(!check.canSpin){

const old =
check.record;


if(old && old.type==="lose"){

result.innerHTML =
"⚠️ این شماره قبلاً بازی کرده است.<br>😅 این بار پوچ شده.";

}

else if(
old &&
old.type==="free"
){

result.innerHTML =
"⚠️ این شماره قبلاً بازی کرده است.<br>🎁 جایزه رایگان شما ثبت شده است.";

if(old.freeItem){

result.innerHTML +=
"<br>آیتم: "+
old.freeItem;

}

}

else if(old){

result.innerHTML =

"⚠️ این شماره قبلاً بازی کرده است."+

"<br>🎉 جایزه: "+
old.label+

"<br>کد: "+

'<span class="code">'+
old.code+
"</span>";

}


spinning=false;

spin.disabled=true;

return;

}


/* گرفتن نتیجه واقعی از سرور */

const response =
await fetch(
WORKER+"/spin",
{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({
