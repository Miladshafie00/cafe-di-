<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>منوی دیجیتال کافه دی</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-image: url('m.jpg');
            --gold-color: #e5b882;
            --gold-bright: #ffd194;
            --font-title: 'Lalezar', sans-serif;
            --font-body: 'Vazirmatn', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font-body);
            background:
                linear-gradient(
                    rgba(12, 12, 12, 0.88),
                    rgba(12, 12, 12, 0.94)
                ),
                var(--bg-image);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: #0d0d0d;
            color: #f5f5f5;
            min-height: 100vh;
            padding-bottom: 30px;
        }

        header {
            text-align: center;
            padding: 30px 15px 12px;
        }

        .logo-container {
            width: 110px;
            height: 110px;
            margin: 0 auto 10px;
            border-radius: 50%;
            border: 2.5px solid var(--gold-color);
            box-shadow: 0 0 25px rgba(229, 184, 130, 0.35);
            overflow: hidden;
            background: #181818;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .logo-placeholder {
            font-family: var(--font-title);
            font-size: 42px;
            color: var(--gold-bright);
            display: none;
        }

        header h1 {
            font-family: var(--font-title);
            font-size: 2.5rem;
            color: var(--gold-bright);
            letter-spacing: 1px;
            text-shadow: 0 0 16px rgba(229, 184, 130, 0.45);
            margin-bottom: 1px;
        }

        header .subtitle {
            color: #d1d1d1;
            font-size: 0.82rem;
            font-weight: 300;
            margin-bottom: 9px;
        }

        .quote-box {
            max-width: 480px;
            margin: 0 auto 7px;
            padding: 8px 13px;
            background: rgba(229, 184, 130, 0.05);
            border-right: 3px solid var(--gold-color);
            border-left: 3px solid var(--gold-color);
            border-radius: 12px;
            font-size: 0.78rem;
            line-height: 1.7;
            color: #e0d0be;
            font-style: italic;
        }

        /* دسته‌ها */

        .category-nav {
            display: flex;
            overflow-x: auto;
            white-space: nowrap;
            justify-content: center;
            gap: 7px;
            padding: 10px 10px;
            position: sticky;
            top: 0;
            background: rgba(14, 14, 14, 0.94);
            backdrop-filter: blur(12px);
            z-index: 100;
            border-bottom: 1px solid rgba(229, 184, 130, 0.22);
        }

        .category-nav::-webkit-scrollbar {
            display: none;
        }

        .cat-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(229, 184, 130, 0.5);
            color: var(--gold-color);
            padding: 5px 13px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.25s ease;
            font-family: var(--font-title);
            font-size: 0.9rem;
            flex-shrink: 0;
        }

        .cat-btn.active,
        .cat-btn:hover {
            background: linear-gradient(135deg, #e5b882, #c79053);
            color: #121212;
            border-color: #ffd194;
            box-shadow: 0 0 12px rgba(229, 184, 130, 0.4);
        }

        main {
            max-width: 580px;
            margin: 17px auto;
            padding: 0 14px;
        }

        .menu-section h2 {
            text-align: center;
            font-family: var(--font-title);
            font-size: 1.8rem;
            color: var(--gold-bright);
            margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(229, 184, 130, 0.25);
        }

        .card {
            background: rgba(255, 255, 255, 0.045);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(8px);
            border-radius: 14px;
            padding: 11px 15px;
            margin-bottom: 9px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.25s ease;
        }

        .card:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(229, 184, 130, 0.4);
        }

        .item-name {
            font-size: 0.92rem;
            font-weight: 600;
            color: #ffffff;
        }

        .price-wrapper {
            display: flex;
            align-items: baseline;
            gap: 4px;
        }

        .price-tag {
            font-family: var(--font-title);
            color: var(--gold-bright);
            font-size: 1.2rem;
            letter-spacing: 0.3px;
        }

        .currency {
            font-size: 0.67rem;
            font-weight: 400;
            color: #c4c4c4;
        }

        /* =========================
           گردونه
           ========================= */

        .wheel-section {
            text-align: center;
            padding: 3px 0 15px;
        }

        .wheel-title {
            font-family: var(--font-title);
            color: var(--gold-bright);
            font-size: 1.8rem;
            margin-bottom: 3px;
        }

        .wheel-subtitle {
            color: #d5d5d5;
            font-size: 0.78rem;
            margin-bottom: 14px;
        }

        .wheel-input {
            width: 100%;
            max-width: 320px;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid rgba(229, 184, 130, 0.55);
            background: rgba(0, 0, 0, 0.35);
            color: white;
            outline: none;
            font-family: var(--font-body);
            font-size: 14px;
            text-align: center;
            direction: ltr;
        }

        .wheel-input::placeholder {
            color: #aaa;
        }

        .wheel-area {
            width: 270px;
            height: 270px;
            max-width: 80vw;
            max-height: 80vw;
            margin: 20px auto 16px;
            position: relative;
        }

        .wheel-pointer {
            position: absolute;
            z-index: 20;
            top: -3px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 13px solid transparent;
            border-right: 13px solid transparent;
            border-top: 25px solid #fff;
            filter: drop-shadow(0 2px 4px #000);
        }

        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 7px solid #d4af73;
            position: relative;
            overflow: hidden;

            background:
                conic-gradient(
                    #4b3020 0deg 45deg,
                    #a96f39 45deg 90deg,
                    #6e482d 90deg 135deg,
                    #b47c43 135deg 180deg,
                    #573823 180deg 225deg,
                    #c18c52 225deg 270deg,
                    #80512c 270deg 315deg,
                    #d5a15e 315deg 360deg
                );

            transition:
                transform 5s cubic-bezier(.12,.72,.16,1);

            box-shadow:
                0 0 0 3px rgba(0,0,0,.3),
                0 8px 25px rgba(0,0,0,.35);
        }

        .wheel::after {
            content: "";
            position: absolute;
            width: 46px;
            height: 46px;
            background: #151515;
            border: 4px solid #e5b882;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
        }

        .wheel-label {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 75px;
            margin-left: -37.5px;
            margin-top: -10px;
            text-align: center;
            color: #fff;
            font-family: var(--font-title);
            font-size: 0.75rem;
            text-shadow: 0 1px 4px #000;
            z-index: 3;
            pointer-events: none;
        }

        .l1 {
            transform: rotate(22.5deg) translateY(-94px) rotate(-22.5deg);
        }

        .l2 {
            transform: rotate(67.5deg) translateY(-94px) rotate(-67.5deg);
        }

        .l3 {
            transform: rotate(112.5deg) translateY(-94px) rotate(-112.5deg);
        }

        .l4 {
            transform: rotate(157.5deg) translateY(-94px) rotate(-157.5deg);
        }

        .l5 {
            transform: rotate(202.5deg) translateY(-94px) rotate(-202.5deg);
        }

        .l6 {
            transform: rotate(247.5deg) translateY(-94px) rotate(-247.5deg);
        }

        .l7 {
            transform: rotate(292.5deg) translateY(-94px) rotate(-292.5deg);
        }

        .l8 {
            transform: rotate(337.5deg) translateY(-94px) rotate(-337.5deg);
        }

        .wheel-spin-btn {
            width: 100%;
            max-width: 320px;
            padding: 11px 15px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #e5b882, #c79053);
            color: #111;
            font-family: var(--font-title);
            font-size: 1rem;
            cursor: pointer;
        }

        .wheel-spin-btn:disabled {
            opacity: .55;
            cursor: not-allowed;
        }

        .wheel-result {
            min-height: 40px;
            margin-top: 12px;
            line-height: 1.9;
            font-size: .85rem;
        }

        .wheel-win {
            color: var(--gold-bright);
            font-size: 1.05rem;
            font-weight: 700;
        }

        .wheel-code {
            display: inline-block;
            direction: ltr;
            background: rgba(229,184,130,.12);
            border: 1px dashed var(--gold-color);
            padding: 3px 9px;
            border-radius: 7px;
            color: var(--gold-bright);
            font-weight: bold;
            letter-spacing: 1px;
        }

        .free-box {
            display: none;
            margin: 12px auto 0;
            max-width: 320px;
            padding: 13px;
            border: 1px solid rgba(229,184,130,.35);
            border-radius: 12px;
            background: rgba(0,0,0,.25);
        }

        .free-box p {
            margin-bottom: 8px;
            color: #eee;
            font-size: .82rem;
        }

        .free-item-input {
            width: 100%;
            padding: 9px;
            border-radius: 9px;
            border: 1px solid rgba(229,184,130,.5);
            background: rgba(0,0,0,.3);
            color: white;
            text-align: center;
            font-family: var(--font-body);
            font-size: 14px;
            outline: none;
        }

        .free-save-btn {
            margin-top: 8px;
            width: 100%;
            padding: 9px;
            border: none;
            border-radius: 9px;
            background: #e5b882;
            color: #111;
            font-family: var(--font-title);
            font-size: .9rem;
            cursor: pointer;
        }

        /* فوتر */

        footer {
            text-align: center;
            margin-top: 25px;
            padding: 15px;
        }

        .instagram-badge {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            background: linear-gradient(
                45deg,
                #f09433,
                #e6683c,
                #dc2743,
                #cc2366,
                #bc1888
            );
            color: #fff;
            text-decoration: none;
            padding: 8px 18px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.82rem;
            direction: ltr;
        }

        .instagram-badge svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        @media (max-width: 500px) {

            .category-nav {
                justify-content: flex-start;
            }

            .cat-btn {
                font-size: 0.82rem;
                padding: 5px 11px;
            }

            header h1 {
                font-size: 2.3rem;
            }

            .wheel-area {
                width: 250px;
                height: 250px;
            }

            .l1,
            .l2,
            .l3,
            .l4,
            .l5,
            .l6,
            .l7,
            .l8 {
                transform-origin: center center;
            }
        }
    </style>
</head>

<script>

/* =========================
   آدرس Worker
   ========================= */

const WORKER =
    "https://cafe-di-discount.miladsh00.workers.dev";


/* =========================
   منوی اصلی کافه دی
   ========================= */

const menuData = {

    coffee: {

        title: 'قهوه‌های تخصصی',

        items: [

            { n: 'تک ۱۰۰٪ روبوستا', p: '۶۰' },
            { n: 'دبل ۱۰۰٪ روبوستا', p: '۷۰' },

            { n: 'دبل ۸۰/۲۰ روبوستا', p: '۷۰' },

            { n: 'تک ۷۰/۳۰ روبوستا', p: '۶۵' },
            { n: 'دبل ۷۰/۳۰ روبوستا', p: '۷۵' },

            { n: 'تک ۱۰۰٪ عربیکا', p: '۱۱۰' },
            { n: 'دبل ۱۰۰٪ عربیکا', p: '۱۲۰' },

            { n: 'تک ۸۰/۲۰ عربیکا', p: '۸۰' },
            { n: 'دبل ۸۰/۲۰ عربیکا', p: '۹۰' },

            { n: 'تک ۷۰/۳۰ عربیکا', p: '۸۵' },
            { n: 'دبل ۷۰/۳۰ عربیکا', p: '۹۵' }

        ]

    },


    hot: {

        title: 'نوشیدنی‌های گرم',

        items: [

            { n: 'کافی میکس', p: '۸۰' },
            { n: 'چای کرک', p: '۸۵' },
            { n: 'هات چاکلت', p: '۸۶' },
            { n: 'ماسالا', p: '۸۵' },
            { n: 'لته', p: '۱۴۰' },
            { n: 'کاپوچینو', p: '۸۰' },
            { n: 'شیر پسته', p: '۸۵' },
            { n: 'شیر زعفران', p: '۸۵' },
            { n: 'موکا', p: '۱۵۰' }

        ]

    },


    cold: {

        title: 'نوشیدنی‌های سرد',

        items: [

            { n: 'آیس لته', p: '۱۵۰' },
            { n: 'آیس موکا', p: '۱۶۰' }

        ]

    },


    dessert: {

        title: 'کیک و دسر',

        items: [

            { n: '(کیک شکلاتی (هر اسلایس', p: '۷۰' }

        ]

    }

};


/* =========================
   تبدیل اعداد فارسی
   ========================= */

function normalizeDigits(value) {

    return String(value)

        .replace(/[۰-۹]/g, function(d) {

            return "۰۱۲۳۴۵۶۷۸۹".indexOf(d);

        })

        .replace(/[٠-٩]/g, function(d) {

            return "٠١٢٣٤٥٦٧٨٩".indexOf(d);

        });

}


/* =========================
   شماره موبایل
   ========================= */

function normalizePhone(value) {

    let phone =
        normalizeDigits(value)
        .trim()
        .replace(/[\s\-()]/g, "");


    if (phone.startsWith("+98")) {

        phone =
            "0" +
            phone.substring(3);

    }
    else if (
        phone.startsWith("98") &&
        phone.length === 12
    ) {

        phone =
            "0" +
            phone.substring(2);

    }


    return phone;

}


function validPhone(phone) {

    return /^09\d{9}$/.test(phone);

}


/* =========================
   نمایش منو
   ========================= */

function showMenu(cat, clickedBtn) {

    const data =
        menuData[cat];

    if (!data) return;


    document
        .querySelectorAll('.cat-btn')
        .forEach(function(btn) {

            btn.classList.remove('active');

        });


    if (clickedBtn) {

        clickedBtn.classList.add('active');

    }


    let html =

        '<div class="menu-section">' +

        '<h2>' +
        data.title +
        '</h2>';


    data.items.forEach(function(item) {

        html +=

            '<div class="card">' +

                '<span class="item-name">' +
                    item.n +
                '</span>' +

                '<div class="price-wrapper">' +

                    '<span class="price-tag">' +
                        item.p +
                    '</span>' +

                    '<span class="currency">' +
                        'هزار تومان' +
                    '</span>' +

                '</div>' +

            '</div>';

    });


    html +=
        '</div>';


    document
        .getElementById('menu-content')
        .innerHTML = html;

}


/* =========================
   نمایش گردونه
   ========================= */

function showWheel(clickedBtn) {

    document
        .querySelectorAll('.cat-btn')
