<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>منوی دیجیتال کافه دی</title>
    <style>
        /* اضافه کردن فونت‌های جذاب */
        @import url('https://cdn.fontcdn.ir/Font/Persian/Vazirmatn/Vazirmatn.css');
        @import url('https://cdn.fontcdn.ir/Font/Persian/IranNastaliq/IranNastaliq.css');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)),
                        url('m.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #fff;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        header {
            text-align: center;
            padding: 50px 20px 20px;
        }

        .logo-container {
            width: 120px;
            height: 120px;
            margin: 0 auto 15px;
            border-radius: 50%;
            border: 3px solid #d4a373;
            box-shadow: 0 0 20px rgba(212, 163, 115, 0.4);
            overflow: hidden;
            background: #222;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .logo-placeholder {
            font-size: 40px;
            color: #d4a373;
            font-weight: bold;
        }

        /* اعمال فونت نستعلیق به تیترها */
        header h2 {
            font-family: 'IranNastaliq', cursive;
            font-size: 2.2rem;
            color: #d4a373;
            margin-bottom: 5px;
        }

        header p {
            color: #aaa;
            font-size: 0.9rem;
        }

        .category-nav {
            display: flex;
            overflow-x: auto;
            white-space: nowrap;
            justify-content: center;
            gap: 10px;
            padding: 15px;
            position: sticky;
            top: 0;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(10px);
            z-index: 100;
        }

        .cat-btn {
            background: transparent;
            border: 1px solid #d4a373;
            color: #d4a373;
            padding: 8px 20px;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Vazirmatn', sans-serif;
            flex-shrink: 0;
        }

        .cat-btn.active {
            background: #d4a373;
            color: #000;
            font-weight: bold;
        }

        main {
            max-width: 600px;
            margin: 20px auto;
            padding: 0 15px;
        }

        /* اعمال فونت نستعلیق به تیتر بخش‌ها */
        .menu-section h2 {
            text-align: center;
            color: #d4a373;
            margin-bottom: 20px;
            font-size: 2rem;
            font-family: 'IranNastaliq', cursive;
        }
    </style>
</head>
<body>
    <!-- بدنه کد بدون تغییر باقی ماند -->
</body>
</html>
