<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>منوی دیجیتال کافه دی</title>

    <!-- فونت‌های گوگل لاله زار و وزیرمتن -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-image: url('m.jpg');
            --gold-color: #e5b882;
            --gold-bright: #ffd194;
            --font-title: 'Lalezar', sans-serif;
            --font-body: 'Vazirmatn', sans-serif;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
        }

        body {
            font-family: var(--font-body);
            background: linear-gradient(rgba(12, 12, 12, 0.88), rgba(12, 12, 12, 0.94)), var(--bg-image);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: #0d0d0d;
            color: #f5f5f5;
            min-height: 100vh;
            padding-bottom: 30px;
        }

        header { 
            text-align: center; 
            padding: 35px 20px 15px; 
        }

        .logo-container {
            width: 120px; 
            height: 120px;
            margin: 0 auto 14px;
            border-radius: 50%;
            border: 2.5px solid var(--gold-color);
            box-shadow: 0 0 25px rgba(229, 184, 130, 0.35);
            overflow: hidden;
            background: #181818;
            display: flex; 
            align-items: center; 
            justify-content: center;
            transition: transform 0.3s ease;
        }

        .logo-container:hover { 
            transform: scale(1.05); 
        }

        .logo-container img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            display: block; 
        }

        .logo-placeholder {
            font-family: var(--font-title);
            font-size: 46px;
            color: var(--gold-bright);
            display: none;
        }

        header h1 {
            font-family: var(--font-title);
            font-size: 2.9rem;
            color: var(--gold-bright);
            letter-spacing: 1px;
            text-shadow: 0 0 16px rgba(229, 184, 130, 0.45);
            margin-bottom: 2px;
        }

        header .subtitle { 
            color: #d1d1d1; 
            font-size: 0.95rem; 
            font-weight: 300; 
            margin-bottom: 12px;
        }

        /* بخش دکلمه */
        .quote-box {
            max-width: 480px;
            margin: 0 auto 10px;
            padding: 10px 16px;
            background: rgba(229, 184, 130, 0.05);
            border-right: 3px solid var(--gold-color);
            border-left: 3px solid var(--gold-color);
            border-radius: 12px;
            font-size: 0.9rem;
            line-height: 1.7;
            color: #e0d0be;
            font-style: italic;
        }

        .category-nav {
            display: flex;
            overflow-x: auto;
            white-space: nowrap;
            justify-content: center;
            gap: 10px;
            padding: 14px 15px;
            position: sticky;
            top: 0;
            background: rgba(14, 14, 14, 0.9);
            backdrop-filter: blur(12px);
            z-index: 100;
            border-bottom: 1px solid rgba(229, 184, 130, 0.22);
        }

        .category-nav::-webkit-scrollbar { display: none; }

        .cat-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1.5px solid rgba(229, 184, 130, 0.5);
            color: var(--gold-color);
            padding: 7px 20px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: var(--font-title);
            font-size: 1.15rem;
            flex-shrink: 0;
        }

        .cat-btn.active, .cat-btn:hover {
            background: linear-gradient(135deg, #e5b882, #c79053);
            color: #121212;
            border-color: #ffd194;
            box-shadow: 0 0 16px rgba(229, 184, 130, 0.45);
            transform: translateY(-2px);
        }

        main { 
            max-width: 580px; 
            margin: 20px auto; 
            padding: 0 16px; 
        }

        .menu-section h2 {
            text-align: center;
            font-family: var(--font-title);
            font-size: 2.1rem;
            color: var(--gold-bright);
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(229, 184, 130, 0.25);
        }

        .card {
            background: rgba(255, 255, 255, 0.045);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(8px);
            border-radius: 16px;
            padding: 14px 20px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.25s ease;
        }

        .card:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(229, 184, 130, 0.4);
            transform: translateX(-4px);
        }

        .item-name {
            font-size: 1.05rem;
            font-weight: 600;
            color: #ffffff;
        }

        .price-wrapper { 
            display: flex; 
            align-items: baseline; 
            gap: 5px; 
        }

        .price-tag {
            font-family: var(--font-title);
            color: var(--gold-bright);
            font-size: 1.45rem;
            letter-spacing: 0.5px;
        }

        .currency { 
            font-size: 0.8rem; 
            font-weight: 400; 
            color: #c4c4c4; 
        }

        /* فوتر و دکمه اینستاگرام */
        footer {
            text-align: center;
            margin-top: 35px;
            padding: 20px;
        }

        .instagram-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            color: #fff;
            text-decoration: none;
            padding: 10px 22px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.95rem;
            box-shadow: 0 4px 15px rgba(220, 39, 67, 0.35);
            transition: transform 0.2s, box-shadow 0.2s;
            direction: ltr;
        }

        .instagram-badge:hover {
            transform: scale(1.04);
            box-shadow: 0 6px 20px rgba(220, 39, 67, 0.5);
        }

        .instagram-badge svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img id="mainLogo" src="s.jpg" alt="لوگوی کافه دی"
                 onerror="this.style.display='none'; document.getElementById('altText').style.display='block';">
            <span id="altText" class="logo-placeholder">دی</span>
        </div>
        <h1>کافه دی</h1>
        <p class="subtitle">طعم دلچسب لحظه‌های ناب</p>
        
        <!-- دکلمه -->
        <div class="quote-box">
            «زندگی مثل یک فنجان قهوه است؛ تلخ و گرم، اما عطر و لحظه‌هایش تا ابد ماندگار... خوش آمدید به خلوت دنج کافه دی»
        </div>
    </header>

    <nav class="category-nav">
        <button class="cat-btn active" data-cat="coffee">منوی قهوه</button>
        <button class="cat-btn" data-cat="hot">بار گرم</button>
        <button class="cat-btn" data-cat="cold">بار سرد</button>
        <button class="cat-btn" data-cat="dessert">دسر</button>
    </nav>

    <main id="menu-content"></main>

    <footer>
        <a href="https://instagram.com/cafedey2026" target="_blank" class="instagram-badge">
            <svg viewBox="0 0 24 24">
                <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
            </svg>
            <span>@cafedey2026</span>
        </a>
    </footer>

    <script>
        const menuData = {
            coffee: {
                title: 'قهوه‌های تخصصی',
                items: [
                    { n: 'تک ۱۰۰٪ روبوستا', p: '۶۰' },
                    { n: 'دبل ۱۰۰٪ روبوستا', p: '۷۰' },
                    { n: 'تک ۸۰/۲۰ روبوستا', p: '۶۰' },
                    { n: 'دبل ۸۰/۲۰ روبوستا', p: '۷۰' },
                    { n: 'تک ۷۰/۳۰ روبوستا', p: '۶۵' },
                    { n: 'دبل ۷۰/۳۰ روبوستا', p: '۷۵' },
                    { n: 'تک ۱۰۰٪ عربیکا', p: '۱۱۰' },
                    { n: 'دبل ۱۰۰٪ عربیکا', p: '۱۲۰' },
                    { n: 'تک ۸۰/۲۰ عربیکا', p: '۸۰' },
                    { n: 'دبل ۸۰/۲۰ عربیکا', p: '۹۰' },
                    { n: 'تک ۷۰/۳۰ عربیکا', p: '۸۵' },     
                    { n: 'دبل ۷۰/۳۰ عربیکا', p: '۹۵' }
                ]
            },
            hot: {
                title: 'نوشیدنی‌های گرم',
                items: [
                    { n: 'کافی میکس', p: '۸۰' },
                    { n: 'چای کرک', p: '۸۵' },
                    { n: 'هات چاکلت', p: '۸۶' },
                    { n: 'ماسالا', p: '۸۵' },
                    { n: 'لته', p: '۱۴۰' },
                    { n: 'کاپوچینو', p: '۸۰' },
                    { n: 'شیر پسته', p: '۸۵' },
                    { n: 'شیر زعفران', p: '۸۵' },
                    { n: 'موکا', p: '۱۵۰' }
                ]
            },
            cold: {
                title: 'نوشیدنی‌های سرد',
                items: [
                    { n: 'آیس لته', p: '۱۵۰' },
                    { n: 'آیس موکا', p: '۱۶۰' }
                ]
            },
            dessert: {
                title: 'کیک و دسر',
                items: [
                    { n: 'کیک شکلاتی', p: '' }
                ]
            }
        };

        function showCat(cat, clickedBtn) {
            const data = menuData[cat];
            if (!data) return;

            document.querySelectorAll('.cat-btn').forEach(function (btn) {
                btn.classList.remove('active');
            });
            if (clickedBtn) clickedBtn.classList.add('active');

            let html = '<div class="menu-section"><h2>' + data.title + '</h2>';
            data.items.forEach(function (item) {
                html += '<div class="card">' +
                            '<span class="item-name">' + item.n + '</span>' +
                            '<div class="price-wrapper">' +
                                '<span class="price-tag">' + item.p + '</span>' +
                                '<span class="currency">هزار تومان</span>' +
                            '</div>' +
                        '</div>';
            });
            html += '</div>';
            document.getElementById('menu-content').innerHTML = html;
        }

        document.addEventListener('DOMContentLoaded', function () {
            const buttons = document.querySelectorAll('.cat-btn');
            buttons.forEach(function (button) {
                button.addEventListener('click', function () {
                    showCat(this.getAttribute('data-cat'), this);
                });
            });
            showCat('coffee', document.querySelector('.cat-btn[data-cat="coffee"]'));
        });
    </script>
</body>
</html>
