<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>منوی دیجیتال کافه دی</title>

    <!-- فونت‌های پایدار از Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-image: url('s.jpg');
            --gold-color: #e5b882;
            --gold-bright: #ffd194;
            --font-title: 'Lalezar', 'Vazirmatn', Tahoma, sans-serif;
            --font-body: 'Vazirmatn', Tahoma, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            background: linear-gradient(rgba(10, 10, 10, 0.82), rgba(10, 10, 10, 0.88)), var(--bg-image);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: #0d0d0d;
            color: #f5f5f5;
            min-height: 100vh;
            padding-);
            text-shadow: 0 0 15px rgba(229, 184, 130, 0.4);
            margin-bottom: 4px;
        }

        header p {
            color: #d1d1d1;
            font-size:);
            text-shadow: 0 0 15px rgba(229, 184, 130, 0.4);
            margin-bottom: 4px;
        }

        header p {
            color: #d1d1d1;
            font-size: 1rem;
            font-weight: 300;
        }

        .logo-container {
            width: 125px;
            height: 125px;
            margin: 0 auto 15px;
            border-radius: 50%;
            border: 2.5px solid var(--gold-color);
            box-shadow: 0 0 25px rgba(229, 184, 130, 0.35);
            overflow: hidden;
            background: #181818;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease;
        }

        .logo-container:hover {
            transform: scale(1.05);
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .logo-placeholder {
            font-size: 45px;
            color: var(--gold-color);
            font-weight: bold;
            display: none;
        }

        .category-nav {
            display: flex;
            overflow-x: auto;
            white-space: nowrap;
            justify-content: center;
            gap: 12px;
            padding: 14px 15px;
            position: sticky;
            top: 0;
            background: rgba(15, 15, 15, 0.88);
            backdrop-filter: blur(12px);
            z-index: 100;
            border-bottom: 1px solid rgba(229, 184, 130, 0.25);
        }

        .category-nav::-webkit-scrollbar {
            display: none;
        }

        .cat-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1.5px solid rgba(229, 184, 130, 0.5);
            color: var(--gold-color);
            padding: 7px 22px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: var(--font-title);
            font-size: 1.15rem;
            flex-shrink: 0;
        }

        .cat-btn.active, .cat-btn:hover {
            background: linear-gradient(135deg, #e5b882, #c79053);
            color: #121212;
            border-color: #ffd194;
            box-shadow: 0 0 16px rgba(229, 184, 130, 0.45);
            transform: translateY(-2px);
        }

        main {
            max-width: 580px;
            margin: 25px auto;
            padding: 0 16px;
        }

        .menu-section h2 {
            text-align: center;
            font-family: var(--font-title);
            font-size: 2.2rem;
            color: var(--gold-bright);
            margin-bottom: 22px;
        }

        .card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(8px);
            border-radius: 16px;
            padding: 14px 20px;
            margin-bottom: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.25s ease;
        }

        .card:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(229, 184, 130, 0.4);
            transform: translateX(-4px);
        }

        .item-name {
            font-size: 1.05rem;
            font-weight: 600;
            color: #ffffff;
        }

        .price-tag {
            font-family: var(--font-title);
            color: var(--gold-bright);
            font-size: 1.3rem;
            white-space: nowrap;
        }

        .currency {
            font-family: var(--font-body);
            font-size: 0.75rem;
            color: #b8b8b8;
            margin-right: 4px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img id="mainLogo" src="m.jpg" alt="لوگوی کافه دی"
                 onerror="this.style.display='none'; document.getElementById('altText').style.display='block';">
            <span id="altText" class="logo-placeholder">دی</span>
        </div>
        <h2>کافه دی</h2>
        <p>تجربه طعمی به‌یادماندنی</p>
    </header>

    <nav class="category-nav">
        <button class="cat-btn active" data-cat="coffee">منوی قهوه</button>
        <button class="cat-btn" data-cat="hot">بار گرم</button>
        <button class="cat-btn" data-cat="cold">بار سرد</button>
        <button class="cat-btn" data-cat="dessert">دسر</button>
    </nav>

    <main id="menu-content"></main>

    <script>
        const menuData = {
            coffee: {
                title: 'قهوه‌های تخصصی',
                items: [
                    { n: 'تک ۱۰۰٪ روبوستا', p: '۶۰,۰۰۰' },
                    { n: 'دبل ۱۰۰٪ روبوستا', p: '۷۰,۰۰۰' },
                    { n: 'تک ۷۰/۳۰ روبوستا', p: '۶۵,۰۰۰' },
                    { n: 'دبل ۷۰/۳۰ روبوستا', p: '۷۵,۰۰۰' },
                    { n: 'تک ۸۰/۲۰ روبوستا', p: '۶۰,۰۰۰' },
                    { n: 'دبل ۸۰/۲۰ روبوستا', p: '۷۰,۰۰۰' },
                    { n: 'تک ۱۰۰٪ عربیکا', p: '۸۰,۰۰۰' },
                    { n: 'دبل ۱۰۰٪ عربیکا', p: '۹۰,۰۰۰' }
                ]
            },
            hot: {
                title: 'نوشیدنی‌های گرم',
                items: [
                    { n: 'لته', p: '۸۵,۰۰۰' },
                    { n: 'هات چاکلت', p: '۸۰,۰۰۰' },
                    { n: 'شیر پسته', p: '۹۰,۰۰۰' },
                    { n: 'شیر زعفران', p: '۹۰,۰۰۰' },
                    { n: 'کاپوچینو', p: '۸۵,۰۰۰' },
                    { n: 'چایی کرک', p: '۶۰,۰۰۰' },
                    { n: 'کافی میکس', p: '۵۰,۰۰۰' },
                    { n: 'ماسالا', p: '۸۰,۰۰۰' },
                    { n: 'موکا', p: '۹۰,۰۰۰' }
                ]
            },
            cold: {
                title: 'نوشیدنی‌های سرد',
                items: [
                    { n: 'آیس لته', p: '۹۵,۰۰۰' },
                    { n: 'آیس موکا', p: '۱۰۰,۰۰۰' }
                ]
            },
            dessert: {
                title: 'کیک و دسر',
                items: [
                    { n: 'کیک شکلاتی', p: '۷۵,۰۰۰' }
                ]
            }
        };

        function showCat(cat, clickedBtn) {
            const data = menuData[cat];
            if (!data) return;

            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            if (clickedBtn) clickedBtn.classList.add('active');

            let html = `<div class="menu-section"><h2>${data.title}</h2>`;
            data.items.forEach(item => {
                html += `
                    <div class="card">
                        <span class="item-name">${item.n}</span>
                        <span class="price-tag">${item.p} <span class="currency">تومان</span></span>
                    </div>
                `;
            });
            html += `</div>`;
            document.getElementById('menu-content').innerHTML = html;
        }

        window.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.cat-btn').forEach(button => {
                button.addEventListener('click', function () {
                    showCat(this.dataset.cat, this);
                });
            });
            showCat('coffee', document.querySelector('.cat-btn[data-cat="coffee"]'));
        });
    </script>
</body>
</html>
