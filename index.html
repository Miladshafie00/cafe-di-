            border: 2.5px solid var(--gold-color);

            display: flex;
            align-items: center;

        }

            font-family: var(--font-title);
            font-size: 2rem;
            color: var(--gold-bright);
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(229,184,130,.25);

            backdrop-filter: blur(8px);
            border-radius: 16px;
            padding: 14px 20px;

            justify-content: space-between;
            align-items: center;

        .item-name {
            font-size: 1.05rem;
            font-weight: 600;
            color: #fff;
        }

        .price-wrapper {
            display: flex;
            align-items: baseline;
            gap: 5px;
            flex-shrink: 0;
        }

        .price-tag {
            font-family: var(--font-title);
            color: var(--gold-bright);
            font-size: 1.4rem;
        }

        .currency {

            color: #c4c4c4;
        }

        .wheel-wrap {

            width: min(330px,86vw);
            height: min(330px,86vw);
            margin: 25px auto;
        }

        #wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 8px solid var(--gold-color);
            background: conic-gradient(
                #76513c 0deg 45deg,
                #a67447 45deg 90deg,
                #684939 90deg 135deg,

                #76513c 180deg 225deg,
                #a67447 225deg 270deg,
                #684939 270deg 315deg,
                #b27d4e 315deg 360deg
            );
            box-shadow: 0 0 30px rgba(229,184,130,.3);
            position: relative;
            transition: transform 5s cubic-bezier(.12,.8,.15,1);
        }

        .wheel-label {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 100%;
            height: 100%;
            transform-origin: center;
            font-family: var(--font-title);
            color: #fff;
            font-size: 1rem;
            text-shadow: 1px 1px 3px #000;
            pointer-events: none;
        }

        .wheel-label span {
            position: absolute;
            top: 12%;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
        }

        .wheel-label:nth-child(1) { transform: translate(-50%,-50%) rotate(22.5deg); }
        .wheel-label:nth-child(2) { transform: translate(-50%,-50%) rotate(67.5deg); }
        .wheel-label:nth-child(3) { transform: translate(-50%,-50%) rotate(112.5deg); }
        .wheel-label:nth-child(4) { transform: translate(-50%,-50%) rotate(157.5deg); }
        .wheel-label:nth-child(5) { transform: translate(-50%,-50%) rotate(202.5deg); }
        .wheel-label:nth-child(6) { transform: translate(-50%,-50%) rotate(247.5deg); }
        .wheel-label:nth-child(7) { transform: translate(-50%,-50%) rotate(292.5deg); }
        .wheel-label:nth-child(8) { transform: translate(-50%,-50%) rotate(337.5deg); }

        .wheel-pointer {
            position: absolute;
            z-index: 10;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid var(--gold-bright);
            filter: drop-shadow(0 3px 4px #000);

</head>

function showCat(cat, clickedBtn) {

    document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.classList.remove('active');
    });

        clickedBtn.classList.add('active');
    }

    if (cat === 'wheel') {
        showWheel();
        return;

    let html =
        '<div class="menu-section">' +
        '<h2>' + data.title + '</h2>';

    data.items.forEach(item => {
        html +=
            '<div class="card">' +

function normalizeDigits(value) {

    return value
        .replace(/[۰-۹]/g, d =>
            '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)
        )
        .replace(/[٠-٩]/g, d =>
            '٠١٢٣٤٥٦٧٨٩'.indexOf(d)
        );
}

function normalizePhone(value) {

    let phone = normalizeDigits(value)
        .replace(/\s/g,'')
        .replace(/-/g,'')
        .replace(/\(/g,'')
        .replace(/\)/g,'');

    if (phone.startsWith('+98')) {
        phone = '0' + phone.substring(3);
    }

    if (phone.startsWith('0098')) {
        phone = '0' + phone.substring(4);
    }

    return phone;
}

async function checkPhone(phone) {

    const response = await fetch(
        WORKER_URL +
        '/check?phone=' +
        encodeURIComponent(phone)
    );

    if (!response.ok) {
        throw new Error('check failed');
    }

    return await response.json();
}
